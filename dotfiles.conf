# Manifest: what gets linked where.
#   <path relative to repo root>   <target, ~ allowed>
# Lines starting with # and blank lines are ignored.
# Everything in bin/ is linked into ~/bin automatically -- not listed here.

shell/bash_profile      ~/.bash_profile
shell/bashrc            ~/.bashrc
shell/zprofile          ~/.zprofile
shell/zshrc             ~/.zshrc
git/gitconfig           ~/.gitconfig
git/gitignore_global    ~/.gitignore_global
config/starship.toml    ~/.config/starship.toml
ssh/config              ~/.ssh/config

# One set of global instructions for every coding agent (see agents/AGENTS.md).
# A tool that saves memories into its file (Gemini CLI's save_memory, a
# Claude Code memory edit) would write them into this public repo, so the file
# tells agents not to. Listing agents/AGENTS.md in ~/.dotfiles.skip unlinks
# all four on that Mac.
agents/AGENTS.md        ~/.claude/CLAUDE.md
agents/AGENTS.md        ~/.codex/AGENTS.md
agents/AGENTS.md        ~/.config/opencode/AGENTS.md
agents/AGENTS.md        ~/.gemini/GEMINI.md
